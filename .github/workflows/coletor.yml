name: coletor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Executar ciclo de coleta
        env:
          FIREBASE_SA_BASE64:     ${{ secrets.FIREBASE_SA_BASE64 }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          INTERVALO_COLETA_HORAS: '6'
          LIMIAR_SANIDADE:        '0.70'
          TETO_CENTAVOS:          '100000000'
          MARGEM_MEDIA_PCT:       '10'
          USER_AGENT:             'MonitorPrecos/1.0 (uso pessoal)'
        run: python -m coletor.main
