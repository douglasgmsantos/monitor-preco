name: coletor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      forcar:
        description: 'Coletar os produtos agora, sem esperar a janela de 30 min'
        type: boolean
        default: true

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Executar ciclo de coleta
        env:
          FIREBASE_SA_BASE64:     ${{ secrets.FIREBASE_SA_BASE64 }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          INTERVALO_COLETA_MINUTOS: '30'
          # Só o disparo manual força. No `schedule`, `inputs` é vazio e isto
          # vira string vazia — que `config._booleano` lê como false. A raspagem
          # de catálogo NÃO é forçada por isto: segue no intervalo de 24h.
          FORCAR_COLETA:          ${{ inputs.forcar }}
          LIMIAR_SANIDADE:        '0.70'
          TETO_CENTAVOS:          '100000000'
          MARGEM_MEDIA_PCT:       '10'
          INTERVALO_RASPAGEM_HORAS: '24'
          CATEGORIAS_RASPAGEM:    'https://www.kabum.com.br/hardware,https://www.kabum.com.br/hardware/ssd-2-5,https://www.kabum.com.br/hardware/kit-hardware,https://www.kabum.com.br/hardware/coolers,https://www.kabum.com.br/hardware/disco-rigido-hd,https://www.kabum.com.br/hardware/fontes,https://www.kabum.com.br/hardware/memoria-ram,https://www.kabum.com.br/hardware/placa-de-video-vga,https://www.kabum.com.br/hardware/placas-mae,https://www.kabum.com.br/hardware/processadores'
          USER_AGENT:             'MonitorPrecos/1.0 (uso pessoal)'
        run: python -m coletor.main
