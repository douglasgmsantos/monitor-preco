name: testes

# Versão ENXUTA, de propósito.
#
# A versão anterior subia o emulador do Firestore no runner (`npm install -g
# firebase-tools` + espera de boot) e levava ~3 min por push. Foi removida em
# 2026-08-14 por custo/benefício. Esta faz só o que é rápido: análise estática e
# a suíte sem emulador, em ~40s.
#
# O QUE ELA COBRE: nome indefinido, import quebrado e os 299 testes que não
# precisam de Firestore. O bug que derrubou a produção em 2026-08-14
# (`NameError: _dia_atualizado`) seria pego aqui, no primeiro passo.
#
# O QUE ELA NÃO COBRE — e é importante não se enganar: os ~88 testes do
# Firestore continuam PULADOS aqui, porque não há emulador. Índice ausente,
# transação malformada e campo com nome trocado na gravação passam por este
# workflow sem reclamar. Antes de mexer em `coletor/repositorio.py`, rode o
# emulador na mão:
#
#   firebase emulators:start --only firestore --project demo-monitor
#   FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 .venv/bin/python -m pytest -q
#
# Verde aqui significa "não quebrei o que dá para checar barato", não "está
# testado". A diferença entre as duas frases já custou uma quebra em produção.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Push seguido cancela o anterior: só interessa o resultado do topo da branch.
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # Primeiro, e separado do pytest: se houver nome indefinido, o log aponta
      # arquivo e linha em segundos, em vez de sair enterrado num traceback.
      - name: Nomes indefinidos (pyflakes)
        run: python -m pyflakes coletor tests

      # `-ra` lista o MOTIVO de cada skip. Sem isso, "88 skipped" no resumo não
      # diz que a camada inteira do Firestore não foi exercitada.
      - name: pytest
        run: python -m pytest -q -ra
